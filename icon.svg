<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- رأس السهم للمتجه -->
    <marker id="arrowhead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    
    <!-- تدرج لوني لسهم الحالة -->
    <linearGradient id="vectorGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- المحيط الخارجي للكرة (Bloch Sphere) -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#64748b" stroke-width="1.8" />

  <!-- خط الاستواء (إهليلج منقط) -->
  <ellipse cx="60" cy="60" rx="42" ry="14" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" />

  <!-- المحور الرأسي Z -->
  <line x1="60" y1="18" x2="60" y2="102" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" />

  <!-- المحور الأفقي Y -->
  <line x1="18" y1="60" x2="102" y2="60" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" />

  <!-- المحور المائل X -->
  <line x1="30" y1="90" x2="90" y2="30" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" />

  <!-- سهم المتجه الكلاسيكي (Electron State Vector) -->
  <line x1="60" y1="60" x2="85" y2="32" stroke="url(#vectorGrad)" stroke-width="2.5" marker-end="url(#arrowhead)" stroke-linecap="round" />

  <!-- نقطة رأس السهم -->
  <circle cx="85" cy="32" r="3" fill="#38bdf8" />

  <!-- نصوص الحالات |0⟩ و |1⟩ -->
  <text x="60" y="11" fill="currentColor" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">|0⟩</text>
  <text x="60" y="116" fill="currentColor" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">|1⟩</text>
</svg>
